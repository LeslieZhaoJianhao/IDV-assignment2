  <script>
    var curve = "";

    for (var i = 0; i <= 200; i++) {
      var x = -10 + i * 0.1;
      var y = 1 / (1 + Math.exp(-x));

      var svgX = 90 + (x + 10) * 32.5;
      var svgY = 460 - y * 420;

      if (i == 0) {
        curve = "M " + svgX + " " + svgY;
      } else {
        curve = curve + " L " + svgX + " " + svgY;
      }
    }

    document.getElementById("sigmoid-curve").setAttribute("d", curve);
  </script>
